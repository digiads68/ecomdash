# Infrastructure only:   docker compose up -d postgres redis
# Full demo:             docker compose --profile demo up --build
x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://ecomdash:ecomdash@postgres:5432/ecomdash
    REDIS_URL: redis://redis:6379
    TIKTOK_SHOP_BASE_URL: http://mock-tiktok:4010/shop
    TIKTOK_AUTH_BASE_URL: http://mock-tiktok:4010/shop-auth
    TIKTOK_ADS_BASE_URL: http://mock-tiktok:4010/ads/open_api/v1.3
    # Authorize URLs are opened by the browser, so they stay on localhost.
    TIKTOK_SHOP_AUTHORIZE_URL: http://localhost:4010/shop-auth/open/authorize
    TIKTOK_ADS_AUTHORIZE_URL: http://localhost:4010/ads/portal/auth
    MOCK_WEBHOOK_URL: http://api:4000/api/webhooks/tiktok

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ecomdash, POSTGRES_PASSWORD: ecomdash, POSTGRES_DB: ecomdash }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ecomdash"], interval: 5s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 10 }

  mock-tiktok:
    profiles: [demo]
    build: .
    image: ecomdash-app
    <<: *app-env
    working_dir: /app/apps/mock-tiktok
    command: ["npx", "tsx", "src/server.ts"]
    ports: ["4010:4010"]

  api:
    profiles: [demo]
    image: ecomdash-app
    <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-tiktok: { condition: service_started }
    working_dir: /app
    command: ["sh", "-c", "pnpm --filter @ecomdash/database db:migrate && pnpm --filter @ecomdash/database db:seed && cd apps/api && node dist/main"]
    ports: ["4000:4000"]
    healthcheck: { test: ["CMD", "curl", "-sf", "http://localhost:4000/api/health"], interval: 5s, timeout: 5s, retries: 30 }

  web:
    profiles: [demo]
    image: ecomdash-app
    <<: *app-env
    depends_on: [api]
    working_dir: /app/apps/web
    command: ["sh", "-c", "NODE_ENV=production npx next start -p 3000"]
    ports: ["3000:3000"]

  demo-connect:
    profiles: [demo]
    image: ecomdash-app
    <<: *app-env
    depends_on:
      api: { condition: service_healthy }
    working_dir: /app
    environment:
      API_PUBLIC_URL: http://api:4000
      MOCK_URL: http://mock-tiktok:4010
    command: ["pnpm", "demo:connect"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
