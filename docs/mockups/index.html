  --good: #34d399; --good-soft: #10302a; --bad: #f87171; --bad-soft: #3a1a20;

  --side: #0a0e19; --side-fg: #c7cdd9; --side-muted: #6b7486; --side-active: #2563eb;
  --banner: #3a2c12; --banner-fg: #fde68a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #151c2e; --surface-2: #1b2338; --line: #263049;
  --fg: #e8ecf5; --muted: #a0a9bf; --faint: #77819a;

<script>
(() => {
/* ───────── dữ liệu mẫu tất định ───────── */
let seed = 20261111;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];
const today = new Date(2026, 10, 14);
const fmtD = d => String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
const vnd = v => new Intl.NumberFormat("vi-VN").format(Math.round(v)) + " ₫";
const vndC = v => { const a = Math.abs(v); const s = v < 0 ? "−" : ""; if (a >= 1e9) return s + (a / 1e9).toFixed(2).replace(".", ",") + " tỷ"; if (a >= 1e6) return s + (a / 1e6).toFixed(1).replace(".", ",") + " tr"; if (a >= 1e3) return s + Math.round(a / 1e3) + "k"; return s + Math.round(a); };
const n = v => new Intl.NumberFormat("vi-VN").format(Math.round(v));
const pct = (v, d = 1) => (v * 100).toFixed(d).replace(".", ",") + "%";

const days = [];
for (let i = 59; i >= 0; i--) {
  const d = new Date(today); d.setDate(d.getDate() - i);
  const wd = d.getDay(); let f = (wd === 0 || wd === 6) ? 1.35 : 1;
  const md = d.getMonth() + 1, dd = d.getDate();
  if ((md === 10 && dd === 10) || (md === 11 && dd === 11)) f *= 3.2;
  if (dd === 25) f *= 1.3;
  const trend = 1 + (59 - i) * 0.004;
  const orders = Math.round(380 * f * trend * (0.86 + rnd() * 0.28));
  const aov = 298000 + rnd() * 52000;
  const gmv = orders * aov;
  const manual = 17e6 * (0.75 + rnd() * 0.4) * (f > 2 ? 2.2 : 1);
  const gmvMax = 13e6 * (0.8 + rnd() * 0.35) * (f > 2 ? 2.6 : 1);
  const cancelled = Math.round(orders * (0.045 + rnd() * 0.03));
  days.push({ d, label: fmtD(d), orders, gmv, manual, gmvMax, spend: manual + gmvMax, cancelled, returns: Math.round(orders * (0.03 + rnd() * 0.02)) });
}
const cur = days.slice(-30), prev = days.slice(-60, -30);
const sum = (a, k) => a.reduce((s, x) => s + x[k], 0);
const chg = (a, b) => b ? (a - b) / b : null;

const palette = ["#e11d48", "#f97316", "#0ea5e9", "#10b981", "#8b5cf6", "#f59e0b", "#14b8a6", "#6366f1", "#ec4899", "#84cc16"];
const productNames = [
  ["Serum Vitamin C 15% Sáng Da 30ml", "30ml / 50ml"], ["Kem Chống Nắng Nâng Tông SPF50+ PA++++", "50ml"],

}
