      <div class="box"><b>Rollup</b><span>ShopDailyStat · ProductDailyStat theo ngày giờ VN</span></div>
      <div class="box"><b>REST</b><span>overview · orders · products · finance · ads · returns · customers</span></div></div></div>
    <div class="flow-arrow">↓ Prisma &nbsp;&nbsp;&nbsp; ↑ JSON</div>
    <div class="layer"><div class="lname">Lưu trữ</div><div class="boxes">
      <div class="box"><b>PostgreSQL</b><span>SellerAuthorization, Shop, Order, OrderLineItem, OrderSettlement, Campaign, AdDailyStat …</span></div>
      <div class="box"><b>Redis</b><span>Hàng đợi BullMQ · lịch lặp</span></div></div></div>
    <div class="flow-arrow">↓</div>
    <div class="layer"><div class="lname">Giao diện</div><div class="boxes"><div class="box"><b>apps/web · Next.js 14</b><span>AUTH_MODE=demo bỏ qua Clerk · dữ liệu qua TanStack Query</span></div></div></div>
  </div></section>
  <section class="panel"><h2>Cần xác minh khi có API thật</h2><div class="legend"><span>Tên metric báo cáo Ads</span><span>· Giới hạn 30 ngày/lần</span><span>· store_id có bằng shop_id</span><span>· Tên trường phí đối soát 202501</span><span>· Rate limit</span><span>· Thời hạn refresh token</span></div>
    <p class="note">Chi tiết và cách kiểm từng mục: docs/architecture/09-go-live-checklist.md</p></section>`;

const cogsRates = [0.36, 0.40, 0.47, 0.38, 0.33, 0.44, 0.30, 0.39, 0.41, 0.37, 0.35, 0.43];
const missingCost = new Set([6, 10, 11]);
const adFactor = [1, 1.1, 2.7, 0.8, 0.9, 1.5, 0.7, 1, 1, 1.2, 0.8, 1];
screens["profit-products"] = () => {
  const rows = products.map((p, i) => { const can = 0.06 + (i % 4) * 0.008, ret = i === 5 ? 0.22 : p.returnRate;
    const real = p.gmv * (1 - can) * (1 - ret); return { p, i, can, ret, real }; });
  const sumReal = rows.reduce((s, r) => s + r.real, 0), sumW = rows.reduce((s, r) => s + r.real * adFactor[r.i], 0);
  rows.forEach(r => { r.fees = r.real * (FEE_R + OTHER_R); r.cogs = r.real * cogsRates[r.i]; const scale = sumReal / P.realized; r.custom = r.p.orders * (PACK + GIFT) * 0.9 + P.fixed * scale * r.real / sumReal;
    r.ad = P.ad * scale * r.real * adFactor[r.i] / sumW; r.net = r.real - r.fees - r.cogs - r.custom - r.ad; r.margin = r.net / r.real; });
  rows.sort((a, b) => a.net - b.net);
  const loss = rows.filter(r => r.net < 0);
  return `${head("Hiệu quả sản phẩm", "Đơn đặt 16/10 – 14/11 · sắp xếp theo lãi ròng, sản phẩm lỗ lên đầu", `<button class="btn">Xuất Excel</button>`)}
  ${loss.length ? `<div class="attn"><div class="attn-item"><div><b>${loss.length} sản phẩm đang lỗ sau quảng cáo: ${loss.map(r => r.p.title.split(" ").slice(0, 3).join(" ")).join(", ")}</b><span>Lỗ tổng ${vnd(-loss.reduce((s, r) => s + r.net, 0))} trong kỳ. Nguyên nhân chính: ${loss.map(r => r.ret > 0.1 ? "tỉ lệ hoàn " + pct(r.ret, 0) : "chi QC phân bổ " + pct(r.ad / r.real, 0) + " doanh thu").join("; ")}.</span></div></div></div>` : ""}
  <div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th class="r">Đã bán</th><th class="r">GMV đặt</th><th class="r">Huỷ + hoàn</th><th class="r">Doanh thu thực</th><th class="r">Giá vốn</th><th class="r">Phí sàn + khác</th><th class="r">Chi phí tự nhập</th><th class="r">QC phân bổ</th><th class="r">Lãi ròng</th><th class="r">Biên</th></tr></thead>
  <tbody>${rows.map(r => `<tr class="${r.net < 0 ? "loss" : ""}"><td><div class="prod">${thumb(r.p)}<div><div class="t">${r.p.title}</div><div class="s">${r.p.skuCount} SKU</div></div></div></td>
    <td class="r">${n(r.p.units)}</td><td class="r">${vndC(r.p.gmv)}</td><td class="r" style="color:${r.ret > 0.1 ? "var(--bad)" : "inherit"}">${pct(r.can + r.ret)}</td><td class="r">${vndC(r.real)}</td>
    <td class="r">${missingCost.has(r.i) ? "≈ " : ""}${vndC(r.cogs)}</td><td class="r">${vndC(r.fees)}</td><td class="r">${vndC(r.custom)}</td><td class="r">${vndC(r.ad)}</td>
    <td class="r"><b style="color:${r.net < 0 ? "var(--bad)" : "var(--good)"}">${vndC(r.net)}</b></td><td class="r">${pct(r.margin)}</td></tr>`).join("")}</tbody></table></div>
  <p class="note">≈ giá vốn đang dùng mặc định 40% giá bán vì chưa nhập. QC phân bổ theo doanh thu thực và mức chạy quảng cáo của từng sản phẩm; TikTok không trả chi phí quảng cáo theo sản phẩm cho chiến dịch thủ công.</p>`;
};

let costFilter = "all";
const customCosts = [
  { name: "Đóng gói", method: "PER_ORDER", amount: 3500, applies: "SHIPPED", from: "01/09/2026", on: true },
  { name: "Quà tặng kèm", method: "PER_ORDER", amount: 6000, applies: "SUCCESS", from: "01/10/2026", on: true },
  { name: "Lương CSKH", method: "MONTHLY_FIXED", amount: 12000000, applies: "", from: "01/09/2026", on: true },
  { name: "Thuê kho", method: "MONTHLY_FIXED", amount: 6000000, applies: "", from: "01/09/2026", on: true },
  { name: "Hoa hồng livestream", method: "PERCENT_REVENUE", amount: 2, applies: "", from: "01/11/2026", on: false }];
const methodLabel = { PER_ORDER: "Cố định mỗi đơn", PERCENT_REVENUE: "% doanh thu thực", MONTHLY_FIXED: "Cố định mỗi tháng" };
const appliesLabel = { PAID: "Mọi đơn đã thanh toán", SHIPPED: "Đơn đã gửi đi", SUCCESS: "Đơn thành công", "": "—" };
let costToast = "";
screens.costs = () => {
  const skus = []; products.forEach((p, i) => p.sku.split(" / ").forEach((s, j) => skus.push({ p, i, name: s, sid: "1730" + (51200 + i * 10 + j), price: p.price + j * 40000,
    cost: missingCost.has(i) ? null : Math.round((p.price + j * 40000) * cogsRates[i] / 1000) * 1000, sold: Math.round(p.units / p.skuCount) })));
  const list = costFilter === "missing" ? skus.filter(s => s.cost == null) : skus;
  const fmtAmt = c => c.method === "PERCENT_REVENUE" ? c.amount.toString().replace(".", ",") + "%" : vnd(c.amount);
  return `${head("Cài đặt · Chi phí", "Giá vốn và chi phí tự nhập dùng để tính lãi ròng trên Dashboard. Sửa xong hệ thống tự tính lại từ ngày áp dụng.")}
  <div class="tabs"><a class="tablink" href="#connections">Kết nối</a><a class="tablink on" href="#costs">Chi phí</a><a class="tablink" href="#costs">Nhóm</a><a class="tablink" href="#costs">Gói dịch vụ</a></div>
  ${costToast ? `<div class="toast" role="status">${costToast}</div>` : ""}
  <section class="panel"><h2>Mặc định của shop</h2>
      <div class="toolbar" style="gap:12px">
        <label class="select"><span class="note">Giá vốn mặc định cho SKU chưa nhập</span><input class="cell num" id="def-cogs" value="40" style="width:60px"> <span>% giá bán</span></label>
        <label class="select"><span>Hàng hoàn được nhập lại kho <span class="note">· tắt nếu hàng hoàn thường hỏng</span></span><span class="toggle"></span></label>
        <span class="note">Đơn hoàn tiền không trả hàng luôn tính mất giá vốn.</span>
      </div></section>
    <section class="panel"><h2>Giá vốn theo SKU <small>Hoa Sen Beauty Official</small></h2>
      <div class="conn-head" style="margin-bottom:10px"><span class="note"><b>87 / 96 SKU</b> đã nhập giá vốn · phần chưa nhập chiếm 7,8% doanh thu</span><div class="meter"><i style="width:90.6%"></i></div></div>
      <div class="toolbar" style="margin-bottom:10px"><input class="search" id="sku-q" placeholder="Tìm sản phẩm, SKU người bán"><div class="seg" id="cfilter"><button data-f="all" class="${costFilter === "all" ? "on" : ""}">Tất cả</button><button data-f="missing" class="${costFilter === "missing" ? "on" : ""}">Chưa nhập (9)</button></div>
        <div class="spacer"></div><button class="btn small">Tải file mẫu Excel</button><button class="btn small">Nhập từ Excel</button></div>
      <div class="table-wrap"><table><thead><tr><th>Sản phẩm / SKU</th><th class="r">Giá bán</th><th class="r">Đã bán 30 ngày</th><th class="r">Giá vốn / đơn vị</th><th>Áp dụng từ</th><th class="r">% giá bán</th></tr></thead><tbody>
      ${list.map((s, k) => `<tr><td><div class="prod">${thumb(s.p)}<div><div class="t">${s.p.title}</div><div class="s">${s.name} · SKU ${s.sid}</div></div></div></td><td class="r">${vnd(s.price)}</td><td class="r">${n(s.sold)}</td>
        <td class="r"><input class="cell num" id="cost-${s.sid}" inputmode="numeric" value="${s.cost == null ? "" : n(s.cost)}" placeholder="Chưa nhập" aria-label="Giá vốn ${s.p.title} ${s.name}"></td>
        <td><input class="cell" id="from-${s.sid}" type="date" value="2026-10-01" aria-label="Áp dụng từ"></td>
        <td class="r">${s.cost == null ? `<span class="badge b-amber">≈ 40% mặc định</span>` : pct(s.cost / s.price, 0)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="toolbar" style="margin-top:10px"><span class="note">Hiển thị ${list.length} / 96 SKU</span><div class="spacer"></div><button class="btn primary" id="save-cost">Lưu giá vốn</button></div></section>
  <section class="panel"><h2>Chi phí tự nhập <small>ngoài giá vốn và phí sàn</small></h2>
    <div class="table-wrap"><table><thead><tr><th>Tên</th><th>Cách tính</th><th class="r">Số tiền</th><th>Áp cho</th><th>Hiệu lực từ</th><th class="r">Trong kỳ</th><th>Bật</th></tr></thead><tbody>
    ${customCosts.map(c => { const inPeriod = !c.on ? 0 : c.method === "PER_ORDER" ? c.amount * (c.applies === "SHIPPED" ? P.paid - P.cancelled : P.successEq) : c.method === "MONTHLY_FIXED" ? c.amount : P.realized * c.amount / 100;
      return `<tr><td>${c.name}</td><td>${methodLabel[c.method]}</td><td class="r">${fmtAmt(c)}</td><td>${appliesLabel[c.applies]}</td><td>${c.from}</td><td class="r">${vndC(inPeriod)}</td><td><span class="toggle ${c.on ? "" : "off"}"></span></td></tr>`; }).join("")}
    </tbody></table></div>
    <form id="cost-form" class="toolbar" style="margin-top:12px">
      <input class="search" id="cf-name" style="width:180px" placeholder="Tên chi phí, vd Phí in bill" required>
      <label class="select"><select id="cf-method"><option value="PER_ORDER">Cố định mỗi đơn</option><option value="PERCENT_REVENUE">% doanh thu thực</option><option value="MONTHLY_FIXED">Cố định mỗi tháng</option></select></label>
      <input class="search" id="cf-amount" style="width:130px" placeholder="Số tiền hoặc %" required inputmode="decimal">
      <label class="select"><select id="cf-applies"><option value="SHIPPED">Đơn đã gửi đi</option><option value="SUCCESS">Đơn thành công</option><option value="PAID">Mọi đơn đã thanh toán</option></select></label>
      <input class="search" id="cf-from" type="date" style="width:150px" value="2026-11-01" aria-label="Hiệu lực từ">
      <button class="btn primary" type="submit">Thêm chi phí</button></form></section>`;
};
screens.costs.after = () => {
  document.querySelectorAll("#cfilter button").forEach(b => b.onclick = () => { costFilter = b.dataset.f; costToast = ""; render(); });
  document.getElementById("save-cost").onclick = () => { costToast = "Đã lưu giá vốn. Đang tính lại số liệu Dashboard từ 01/10/2026…"; render(); };
  document.getElementById("cost-form").onsubmit = e => { e.preventDefault();
    const m = document.getElementById("cf-method").value, a = parseFloat(document.getElementById("cf-amount").value.replace(/\./g, "").replace(",", ".")) || 0;
    const d = document.getElementById("cf-from").value.split("-").reverse().join("/");
    customCosts.push({ name: document.getElementById("cf-name").value, method: m, amount: a, applies: m === "PER_ORDER" ? document.getElementById("cf-applies").value : "", from: d, on: true });
    costToast = `Đã thêm chi phí. Đang tính lại số liệu Dashboard từ ${d}…`; render(); };
};


/* ───────── điều hướng ───────── */
const navDef = [
  ["Tổng quan", [["overview", "Dashboard"], ["profit-products", "Hiệu quả sản phẩm", true]]],
  ["Bán hàng", [["orders", "Đơn hàng"], ["products", "Sản phẩm"], ["returns", "Hoàn / Huỷ", true], ["customers", "Khách hàng"]]],
  ["Tiền", [["finance", "Đối soát", true], ["ads", "Quảng cáo"]]],
  ["Vận hành", [["alerts", "Cảnh báo"], ["reports", "Báo cáo định kỳ"]]],
  ["Cài đặt", [["costs", "Chi phí", true], ["connections", "Kết nối", true]]],
  ["Tài liệu", [["architecture", "Sơ đồ kiến trúc"]]]
];

document.getElementById("nav").innerHTML = navDef.map(([g, items]) => `<div class="nav-group">${g}</div>` + items.map(([k, l, isNew]) => `<a href="#${k}" data-k="${k}"><span class="dot"></span>${l}${isNew ? `<span class="new">mới</span>` : ""}</a>`).join("")).join("");

function render() {
  charts.forEach(c => c.dispose()); charts = [];
  let key = location.hash.slice(1); if (!screens[key]) key = "overview";
  const navKey = key === "order-detail" ? "orders" : key;
  if (key !== "costs") costToast = "";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.k === navKey));
  document.getElementById("view").innerHTML = screens[key]();
  screens[key].after && screens[key].after();
  side.classList.remove("open"); shade.classList.remove("open");
}
const side = document.getElementById("side"), shade = document.getElementById("shade");
document.getElementById("menuBtn").onclick = () => { side.classList.add("open"); shade.classList.add("open"); };
shade.onclick = () => { side.classList.remove("open"); shade.classList.remove("open"); };
document.querySelectorAll("#range button").forEach(b => b.onclick = () => { document.querySelectorAll("#range button").forEach(x => x.classList.toggle("on", x === b)); });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
window.addEventListener("resize", () => charts.forEach(c => c.resize()));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
})();
</script>
